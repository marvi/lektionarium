# Föråldrade beroenden var en stor del av det som behövde städas upp.
# Dependabot håller dem à jour framöver.
version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
