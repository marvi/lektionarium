name: Bygg och testa

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Maven kommer via wrappern i repot, så bara en JDK behövs.
      - name: Bygg och kör tester
        run: ./mvnw -B --no-transfer-progress verify

      - name: Spara testrapporter
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testrapporter
          path: '**/target/surefire-reports/*'
