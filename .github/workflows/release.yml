name: Publicera en version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version att publicera, t.ex. 0.2.0'
        required: true
      nextVersion:
        description: 'Nästa utvecklingsversion utan -SNAPSHOT, t.ex. 0.3.0'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # för att kunna skjuta tagg och versionshöjning
      packages: write   # för att kunna publicera till GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Sätt versionsnummer
        run: ./mvnw -B --no-transfer-progress versions:set
          -DnewVersion=${{ inputs.version }} -DgenerateBackupPoms=false

      - name: Bygg och testa
        run: ./mvnw -B --no-transfer-progress verify

      - name: Publicera till GitHub Packages
        run: ./mvnw -B --no-transfer-progress -Prelease deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tagga och höj till nästa utvecklingsversion
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "Version ${{ inputs.version }}"
          git tag -a "v${{ inputs.version }}" -m "Version ${{ inputs.version }}"
          ./mvnw -B --no-transfer-progress versions:set \
            -DnewVersion=${{ inputs.nextVersion }}-SNAPSHOT -DgenerateBackupPoms=false
          git commit -am "Fortsätt på ${{ inputs.nextVersion }}-SNAPSHOT"
          git push origin HEAD:${{ github.ref_name }} --follow-tags
