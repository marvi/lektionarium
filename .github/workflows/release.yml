name: Publicera en version

# Taggen är det som utlöser publiceringen. Skapa den med tools/release.sh,
# som höjer versionen i pom-filerna, kör igenom bygget och taggar.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # för att kunna skapa en GitHub-release
      packages: write   # för att kunna publicera till GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Läs versionen ur taggen
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Taggen och pom-filerna måste vara överens, annars publiceras en
      # artefakt vars versionsnummer inte är det taggen utlovar.
      - name: Kontrollera att taggen stämmer med pom-filerna
        run: |
          pom=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version | tail -1)
          tag=${{ steps.version.outputs.version }}
          echo "pom: $pom, tagg: $tag"
          if [ "$pom" != "$tag" ]; then
            echo "::error::Taggen v$tag pekar på en commit där pom-filerna står på $pom"
            exit 1
          fi

      - name: Bygg och kör testerna
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Anslut till tailnetet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Hämta hem befintligt repo
        run: |
          mkdir -p "$HOME/maven/"
          rsync -a deploy@${{ vars.MAVEN_HOST }}:/srv/www/maven/ \
                   "$HOME/maven/"

      - name: Deploya till det lokala trädet
        run: |
          ./mvnw -B --no-transfer-progress -Prelease deploy -DskipTests \
            -DaltDeploymentRepository="marvi::file://$HOME/maven"

      - name: Ladda upp
        run: |
          rsync -a --chmod=D755,F644 \
            "$HOME/maven/" deploy@${{ vars.MAVEN_HOST }}:/srv/www/maven/

      # Avbilden byggs sist, så den bara publiceras när testerna gått igenom.
      # Bygget sker på en Linux-runner för linux/amd64. Vill du ha arm64 med
      # krävs QEMU, och då körs hela Maven-bygget under emulering.
      - name: Logga in på ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Bygg och publicera containeravbilden
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          image="ghcr.io/${{ github.repository }}"
          docker build \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --tag "$image:$VERSION" \
            --tag "$image:latest" \
            .
          docker push "$image:$VERSION"
          docker push "$image:latest"

      - name: Skapa en GitHub-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Version $VERSION" \
            --generate-notes \
            api/target/lektionarium-api-"$VERSION".jar \
            cli/target/lektionarium-cli-"$VERSION".jar \
            web/target/lektionarium-web-"$VERSION".jar
