name: Publicera en version

# Taggen är det som utlöser publiceringen. Skapa den med tools/release.sh,
# som höjer versionen i pom-filerna, kör igenom bygget och taggar.
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # för att kunna skapa en GitHub-release
      packages: write   # för att kunna publicera till GitHub Packages

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github

      - name: Läs versionen ur taggen
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Taggen och pom-filerna måste vara överens, annars publiceras en
      # artefakt vars versionsnummer inte är det taggen utlovar.
      - name: Kontrollera att taggen stämmer med pom-filerna
        run: |
          pom=$(./mvnw -q -DforceStdout help:evaluate -Dexpression=project.version | tail -1)
          tag=${{ steps.version.outputs.version }}
          echo "pom: $pom, tagg: $tag"
          if [ "$pom" != "$tag" ]; then
            echo "::error::Taggen v$tag pekar på en commit där pom-filerna står på $pom"
            exit 1
          fi

      - name: Bygg och kör testerna
        run: ./mvnw -B --no-transfer-progress clean verify

      - name: Publicera till GitHub Packages
        run: ./mvnw -B --no-transfer-progress -Prelease deploy -DskipTests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skapa en GitHub-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Version $VERSION" \
            --generate-notes \
            api/target/lektionarium-api-"$VERSION".jar \
            cli/target/lektionarium-cli-"$VERSION".jar \
            web/target/lektionarium-web-"$VERSION".jar
