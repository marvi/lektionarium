name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '28 23 * * 0'

jobs:
  analyze:
    name: Analysera
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read

    strategy:
      fail-fast: false
      matrix:
        # Projektet är rent Java sedan React-appen togs bort.
        language: [ 'java-kotlin' ]

    steps:
      - uses: actions/checkout@v4

      - name: Sätt upp JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initiera CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # Vi bygger själva nedan i stället för att låta autobuild gissa.
          # Utan build-mode vet CodeQL inte det, och kan sluta med att inte se
          # någon källkod alls.
          build-mode: manual

      - name: Bygg
        run: ./mvnw -B --no-transfer-progress install -DskipTests

      - name: Kör CodeQL
        uses: github/codeql-action/analyze@v4
