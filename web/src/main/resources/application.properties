spring.application.name=lektionarium

# JTE: mallarna kompileras av jte-maven-plugin vid bygget.
gg.jte.developmentMode=false
gg.jte.usePrecompiledTemplates=true
gg.jte.templateLocation=src/main/jte

# Adressen klienter ska hämta om prenumerationsflödet ifrån. Måste komma
# härifrån och inte ur Host-huvudet, som anroparen styr över.
lektionarium.base-url=https://lektionarium.se

# Vilken dag det är avgörs i svensk tid, oavsett vilken zon servern kör i.
lektionarium.zone=Europe/Stockholm

# Statiska filer ligger på adresser utan versionsnummer, så en ändrad CSS slår
# inte igenom förrän cachen gått ut. Ett dygn är en avvägning mellan det och
# att slippa onödiga hämtningar.
spring.web.resources.cache.cachecontrol.max-age=1d
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/calendar,text/csv,application/json
